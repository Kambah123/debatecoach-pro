version: '3.8'

services:
  solaire:
    build: .
    container_name: solaire
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - SOLAIRE_HOME=/data
    volumes:
      - ./data:/data
      - ./logs:/app/logs
    ports:
      - "7777:7777"
    networks:
      - solaire-network

networks:
  solaire-network:
    driver: bridge
